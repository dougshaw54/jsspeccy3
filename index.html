<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>JSSpeccy v3 Receiver</title>
  <style>
    body, html { 
      margin: 0; padding: 0; width: 100%; height: 100%; 
      background: #000; overflow: hidden; 
      display: flex; justify-content: center; align-items: center; 
    }
    #jsspeccy { width: 100%; height: 100%; }
  </style>
  <!-- Load the main jsspeccy script from your runtime directory -->
  <script src="runtime/jsspeccy.js"></script>
</head>
<body>

  <div id="jsspeccy"></div>

  <script>
    let emu = null;

    window.addEventListener('load', () => {
      try {
        // Initialize JSSpeccy v3 using the container element and options
        emu = JSSpeccy(document.getElementById('jsspeccy'), {
          autoStart: true,
          zoom: 2,
          sandbox: false
        });
        window.emu = emu;
      } catch (err) {
        console.error("Initialization error:", err);
      }

      // Notify the parent Google Sheet frame that we are ready
      if (window.parent) {
        window.parent.postMessage({ status: 'READY' }, '*');
      }
    });

    // Listen for the snapshot payload coming from Google Apps Script
    window.addEventListener('message', (event) => {
      const msg = event.data;
      if (msg && msg.action === 'loadSnapshot' && msg.base64 && window.emu) {
        try {
          const binaryString = atob(msg.base64);
          const bytes = new Uint8Array(binaryString.length);
          for (let i = 0; i < binaryString.length; i++) {
            bytes[i] = binaryString.charCodeAt(i);
          }
          // Use v3 file loading method to inject the binary buffer
          window.emu.openFile(msg.fileName || 'snapshot.sna', bytes);
        } catch (err) {
          console.error("Failed to inject snapshot:", err);
        }
      }
    });
  </script>
</body>
</html>
