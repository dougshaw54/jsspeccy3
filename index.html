<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSSpeccy v3 Receiver</title>
  <style>
    html, body { 
      margin: 0; padding: 0; width: 100vw; height: 100vh; 
      background: #000; overflow: hidden; 
      display: flex; justify-content: center; align-items: center; 
    }
    #speccy-container { width: 100vw; height: 100vh; }
  </style>
</head>
<body>

  <div id="speccy-container"></div>

  <!-- Load as an ES module since jsspeccy.js relies on internal module imports -->
  <script type="module">
    import { JSSpeccy } from './runtime/jsspeccy.js';

    let speccy = null;

    window.addEventListener('load', function() {
      const container = document.getElementById('speccy-container');

      try {
        speccy = JSSpeccy(container, {
          autoStart: true,
          zoom: 3,
          sandbox: false
        });
        
        window.speccy = speccy;
      } catch (e) {
        console.error("JSSpeccy v3 init error:", e);
      }

      // Signal Google Apps Script that receiver is ready
      if (window.parent) {
        window.parent.postMessage({ status: 'READY' }, '*');
      }
    });

    // Receive and inject snapshot payload from Apps Script
    window.addEventListener('message', function(event) {
      const msg = event.data;
      if (msg && msg.action === 'loadSnapshot' && msg.base64 && window.speccy) {
        try {
          const binaryString = window.atob(msg.base64);
          const bytes = new Uint8Array(binaryString.length);
          for (let i = 0; i < binaryString.length; i++) {
            bytes[i] = binaryString.charCodeAt(i);
          }
          
          if (typeof window.speccy.openFile === 'function') {
            window.speccy.openFile(msg.fileName || 'snapshot.sna', bytes);
          }
        } catch (err) {
          console.error("Snapshot load error:", err);
        }
      }
    });
  </script>
</body>
</html>
